<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Elemen Output</title>
</head>
<body>
    <form oninput="z.value = parseInt(x.value) + parseInt(y.value)">
        <input id="x" type="range" min="0" max="10" step="1" value="0"> 0
        +
        <input id="y" type="number" value="10">

        =
        <output name="z" for="x y">10</output>
    </form>
</body>
</html>
